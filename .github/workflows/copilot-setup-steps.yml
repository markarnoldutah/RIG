name: "Copilot Setup Steps"

# Copilot agent environment setup — kept separate from CI/CD workflows
# (ci.yml, deploy.yml, mobile.yml, valhalla.yml per the Implementation Plan).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Skipped until the solution and pipeline exist; restore once they do.
      - name: Restore NuGet packages
        if: hashFiles('BigRig.slnx') != ''
        run: dotnet restore BigRig.slnx

      - name: Install pipeline dependencies
        if: hashFiles('pipeline/requirements.txt') != ''
        run: pip install -r pipeline/requirements.txt
